<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betómetro · __NOMBRE__</title>
<style>
:root{--bg:#121417;--borde:#2c3137;--ink:#eef0f2;--sub:#8a929b;--rojo:#d7263d;--ama:#f5c518;--verde:#2ecc71;--azul:#3d8bfd;--celeste:#7fd3ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:repeating-linear-gradient(135deg,#15181b 0 6px,#121417 6px 12px)}
main{max-width:560px;margin:0 auto;padding:18px 14px 30px}
h1{font-size:24px;margin:0;font-weight:800}.fecha{color:var(--sub);font-size:13px;margin:2px 0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:0;cursor:pointer;padding:7px 12px;border-radius:99px;font:700 13px system-ui,sans-serif;background:#22262b;color:#c2c7cc}
.chip.on{background:var(--rojo);color:#fff}.chip small{opacity:.7;font-weight:600;margin-left:4px}
.modo{padding:4px 10px;font-size:12px}
.card{background:linear-gradient(#1d2024,#131518);border:1px solid var(--borde);border-radius:16px;padding:12px;margin-bottom:10px}
.t{font-size:10px;letter-spacing:.16em;color:var(--sub);font-weight:700;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.t b{color:var(--ink);letter-spacing:0;font-size:12px;text-align:right}
svg{display:block;width:100%;height:auto;touch-action:none}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#aab;margin-top:6px}.lg i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.k div{background:#1a1d21;border:1px solid var(--borde);border-radius:12px;padding:8px 4px;text-align:center}
.k b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.k span{font-size:9px;color:var(--sub);letter-spacing:.12em;font-weight:700}
.lect{position:sticky;top:0;z-index:5;background:#0d0f11ee;border:1px solid var(--borde);border-radius:12px;padding:8px 6px;margin-bottom:10px;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-variant-numeric:tabular-nums}
.lect b{display:block;font-size:16px}.lect span{font-size:9px;color:var(--sub);letter-spacing:.1em;font-weight:700}
.eje{fill:var(--sub);font-size:10px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 4px;text-align:right;border-top:1px solid #2a2e33}th{color:var(--sub);font-size:9px;letter-spacing:.1em;font-weight:700;border-top:0}
td:first-child,th:first-child,td:nth-child(2),th:nth-child(2){text-align:left}
tr.sel td{background:#d7263d22}tr.clic{cursor:pointer}
.tag{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.tot td{font-weight:800;border-top:2px solid #444}
.aviso{color:var(--sub);font-size:13px;text-align:center;padding:16px 6px}
.pie{text-align:center;color:var(--sub);font-size:11px;margin-top:14px}
</style></head><body><main>
<h1 id="tit"></h1><div class="fecha" id="fecha"></div>
<div id="conRecorrido">
<div class="chips" id="vueltas"></div>
<div class="k" id="kpi"></div>
<div class="lect" id="lect"></div>
<div class="card"><div class="t">Recorrido de la vuelta</div><div class="chips" id="modos"></div>
  <svg id="mapa" viewBox="0 0 364 330"></svg><div class="lg" id="ley"></div></div>
<div class="card"><div class="t">Velocidad km/h<b id="vInfo"></b></div><svg id="gVel" viewBox="0 0 364 160"></svg></div>
<div class="card"><div class="t">Aceleración m/s²<b id="aInfo"></b></div><svg id="gAce" viewBox="0 0 364 150"></svg>
  <div class="lg"><span><i style="background:var(--verde)"></i>acelera</span><span><i style="background:var(--rojo)"></i>frena</span></div></div>
<div class="pie" style="margin:0 0 12px">tocá o deslizá el dedo sobre el mapa o los gráficos</div>
</div>
<div class="card"><div class="t">Todas las vueltas<b id="totInfo"></b></div><div id="tabla"></div></div>
<div class="pie">Generado con Betómetro</div>
</main>
<script>
const C=__DATOS__;
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
const E=(p,n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.append(e);return e};
const nf=(x,d)=>x.toFixed(d).replace('.',',');
const tfmt=ms=>{const s=Math.abs(ms)/1000,h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=(s%60).toFixed(1).padStart(4,'0').replace('.',',');return h?h+':'+String(m).padStart(2,'0')+':'+r:m+':'+r};
const dur=ms=>Math.abs(ms)<59950?nf(Math.abs(ms)/1000,1)+' s':tfmt(ms);
const dif=ms=>(ms>0?'+':ms<0?'−':'±')+dur(ms);
$('tit').textContent=C.nombre;
$('fecha').textContent=new Date(C.fecha+'T12:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · ideal '+tfmt(C.idealMs)+(C.distanciaM?' · '+C.distanciaM.toLocaleString('es-AR')+' m':'');
const vSug=C.distanciaM?C.distanciaM/(C.idealMs/1000)*3.6:null;
const conT=C.vueltas.map((v,i)=>i).filter(i=>C.vueltas[i].m);
let lap=conT.length?conT[0]:-1,modo='vel',sel=null;
const MODOS={vel:'Velocidad',ace:'Aceleración',ade:'Adelanto'};
const colVel=v=>{if(!vSug)return'var(--verde)';const d=v-vSug;return d>6?'var(--rojo)':d>2?'var(--ama)':d<-6?'var(--azul)':d<-2?'var(--celeste)':'var(--verde)'};
const colAce=a=>a>0.8?'var(--verde)':a>0.25?'#8fe3b0':a<-0.8?'var(--rojo)':a<-0.25?'#f08a96':'#9aa3ad';
const colAde=s=>{const a=Math.abs(s);return a<1?'var(--verde)':a<3?'var(--ama)':'var(--rojo)'};
const LEY={vel:[['var(--azul)','muy lento'],['var(--verde)','en sugerida'],['var(--ama)','rápido'],['var(--rojo)','muy rápido'],['#555','sin señal']],
 ace:[['var(--rojo)','frena fuerte'],['#9aa3ad','parejo'],['var(--verde)','acelera fuerte'],['#555','sin señal']],
 ade:[['var(--verde)','±1 s'],['var(--ama)','1 a 3 s'],['var(--rojo)','más de 3 s'],['#555','sin señal']]};
const color=p=>modo==='vel'?colVel(p[2]):modo==='ace'?colAce(p[3]):colAde(p[4]);
const nombreV=v=>'V'+v.n+(C.largadas>1?' L'+v.largada:'');
// tabla con todas las vueltas
(()=>{let h='<table><tr><th>VUELTA</th><th>TIPO</th><th>TIEMPO</th><th>DIF.</th><th>PROM</th><th>MÁX</th></tr>';
  C.vueltas.forEach((v,i)=>{h+=`<tr data-i="${i}" class="${v.m?'clic':''}"><td><b>${nombreV(v)}</b></td><td><span class="tag" style="background:${v.medida?'var(--rojo)':'var(--verde)'}"></span>${v.medida?'medida':'práctica'}</td><td>${tfmt(v.realMs)}</td><td style="color:${colAde(v.difMs/1000)}">${dif(v.difMs)}</td><td>${v.velPromKmh!=null?nf(v.velPromKmh,1):'–'}</td><td>${v.velMaxKmh!=null?Math.round(v.velMaxKmh):'–'}</td></tr>`});
  const med=C.vueltas.filter(v=>v.medida);
  if(med.length){const s=med.reduce((a,v)=>a+Math.abs(v.difMs),0);h+=`<tr class="tot"><td colspan="3">Error total · ${med.length} medida${med.length>1?'s':''}</td><td colspan="3">${dur(s)}</td></tr>`;$('totInfo').textContent='promedio '+dur(s/med.length);}
  $('tabla').innerHTML=h+'</table>';
  $('tabla').querySelectorAll('tr.clic').forEach(r=>r.onclick=()=>{lap=+r.dataset.i;sel=null;dibujar();scrollTo({top:0,behavior:'smooth'})});})();
if(lap<0){$('conRecorrido').innerHTML='<div class="card aviso">Esta carrera no tiene el recorrido grabado. Se graba con el GPS en las carreras corridas desde la versión 1.8 de Betómetro.</div>';}
else{
conT.forEach(i=>{const v=C.vueltas[i],b=document.createElement('button');b.className='chip';b.dataset.i=i;b.innerHTML=nombreV(v)+'<small>'+(v.medida?'medida':'práctica')+'</small>';b.onclick=()=>{lap=i;sel=null;dibujar()};$('vueltas').append(b)});
for(const k in MODOS){if(k==='ade'&&!C.distanciaM)continue;const b=document.createElement('button');b.className='chip modo';b.dataset.m=k;b.textContent=MODOS[k];b.onclick=()=>{modo=k;dibujar()};$('modos').append(b)}
dibujar();}
function X(d,W){return 30+(W-36)*d/C.vueltas[lap].L}
function dibujar(){
  const V=C.vueltas[lap],M=V.m,err=V.difMs;
  document.querySelectorAll('#vueltas .chip').forEach(b=>b.classList.toggle('on',+b.dataset.i===lap));
  document.querySelectorAll('#modos .chip').forEach(b=>b.classList.toggle('on',b.dataset.m===modo));
  document.querySelectorAll('#tabla tr[data-i]').forEach(r=>r.classList.toggle('sel',+r.dataset.i===lap));
  const ok=M.filter(p=>p[7]),vs=ok.map(p=>p[2]),as=ok.map(p=>p[3]);
  $('kpi').innerHTML=`<div><b>${tfmt(V.realMs)}</b><span>TIEMPO</span></div><div><b style="color:${colAde(err/1000)}">${dif(err)}</b><span>VS IDEAL</span></div><div><b>${V.velPromKmh!=null?nf(V.velPromKmh,1):'–'}</b><span>KM/H PROM</span></div><div><b>${vs.length?Math.round(Math.max(...vs)):'–'}</b><span>KM/H MÁX</span></div>`;
  $('vInfo').textContent=vSug?'sugerida '+nf(vSug,1):'';
  $('aInfo').textContent=as.length?'máx +'+nf(Math.max(...as),1)+' · frenada '+nf(Math.min(...as),1):'';
  $('ley').innerHTML=LEY[modo].map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join('');
  // mapa: el recorrido armado con todas las vueltas (gris) y encima esta vuelta pintada
  const m=$('mapa');m.innerHTML='';
  E(m,'polyline',{points:C.pista.map(p=>p.join(',')).join(' ')+(C.cerrada?' '+C.pista[0].join(','):''),fill:'none',stroke:'#3a3f45','stroke-width':11,'stroke-linecap':'round','stroke-linejoin':'round'});
  for(let i=1;i<M.length;i++){if(!M[i][7]||!M[i-1][7])continue;E(m,'line',{x1:M[i-1][5],y1:M[i-1][6],x2:M[i][5],y2:M[i][6],stroke:color(M[i]),'stroke-width':8,'stroke-linecap':'round'})}
  const p0=C.pista[0];E(m,'circle',{cx:p0[0],cy:p0[1],r:6,fill:'#fff'});const tl=E(m,'text',{x:p0[0]+10,y:p0[1]-8,fill:'#fff','font-size':10,'font-weight':700});tl.textContent='LARGADA';
  if(as.length){let iF=-1;M.forEach((p,i)=>{if(p[7]&&(iF<0||p[3]<M[iF][3]))iF=i});if(M[iF][3]<-0.3){E(m,'circle',{cx:M[iF][5],cy:M[iF][6],r:8,fill:'none',stroke:'#fff','stroke-width':2});const tf=E(m,'text',{x:M[iF][5]>250?M[iF][5]-12:M[iF][5]+12,y:M[iF][6]+4,fill:'#fff','font-size':10,'text-anchor':M[iF][5]>250?'end':'start'});tf.textContent='frenada '+nf(M[iF][3],1);}}
  // velocidad
  const g=$('gVel'),W=364,H=160;g.innerHTML='';const vmax=Math.max(20,Math.ceil(Math.max(...vs,(vSug||0)+10)/10)*10),yv=v=>H-14-(v/vmax)*(H-24);
  for(let k=0;k<=vmax+.1;k+=vmax/4){E(g,'line',{x1:30,x2:W-6,y1:yv(k),y2:yv(k),stroke:'#262a2f'});const t=E(g,'text',{x:2,y:yv(k)+3,class:'eje'});t.textContent=Math.round(k)}
  if(vSug)E(g,'line',{x1:30,x2:W-6,y1:yv(vSug),y2:yv(vSug),stroke:'#fff','stroke-dasharray':'4 4','stroke-width':1});
  for(let i=1;i<M.length;i++){const a=M[i-1],b=M[i];if(!a[7]||!b[7]){E(g,'line',{x1:X(a[1],W),y1:H-14,x2:X(b[1],W),y2:H-14,stroke:'#555','stroke-width':3});continue}
    E(g,'line',{x1:X(a[1],W),y1:yv(a[2]),x2:X(b[1],W),y2:yv(b[2]),stroke:color(b),'stroke-width':3,'stroke-linecap':'round'})}
  // aceleración
  const ac=$('gAce'),Ha=150;ac.innerHTML='';const am=Math.max(0.5,...as.map(Math.abs)),ya=k=>Ha/2-(k/am)*(Ha/2-10);
  E(ac,'line',{x1:30,x2:W-6,y1:Ha/2,y2:Ha/2,stroke:'#555'});
  [[am,'+'+nf(am,1)],[-am,'−'+nf(am,1)]].forEach(([k,t])=>{const e=E(ac,'text',{x:2,y:ya(k)+3,class:'eje'});e.textContent=t});
  const bw=Math.max(1.5,(W-36)/M.length*0.7);
  M.forEach(p=>{if(p[7])E(ac,'rect',{x:X(p[1],W)-bw/2,width:bw,y:Math.min(Ha/2,ya(p[3])),height:Math.max(.5,Math.abs(ya(p[3])-Ha/2)),fill:p[3]>=0?'var(--verde)':'var(--rojo)'})});
  marcar(sel===null?Math.floor(M.length/3):sel);
}
function marcar(i){
  const M=C.vueltas[lap].m;sel=Math.max(0,Math.min(M.length-1,i));const p=M[sel];
  const sv=p[7]?`<b style="color:${colVel(p[2])}">${nf(p[2],1)}</b>`:'<b style="color:#777">–</b>';
  const sa=p[7]?`<b style="color:${p[3]>=0?'var(--verde)':'var(--rojo)'}">${p[3]>=0?'+':'−'}${nf(Math.abs(p[3]),1)}</b>`:'<b style="color:#777">–</b>';
  const sd=C.distanciaM?`<b style="color:${colAde(p[4])}">${p[4]>0?'+':p[4]<0?'−':'±'}${nf(Math.abs(p[4]),1)} s</b><span>${p[4]>=0?'ADELANTADO':'ATRASADO'}</span>`:`<b>${tfmt(p[0]*1000)}</b><span>TIEMPO</span>`;
  $('lect').innerHTML=`<div><b>${Math.round(p[1]).toLocaleString('es-AR')} m</b><span>DISTANCIA</span></div><div>${sv}<span>KM/H</span></div><div>${sa}<span>M/S²</span></div><div>${sd}</div>`;
  for(const id of ['gVel','gAce']){const s=$(id);let c=s.querySelector('.cur');if(!c)c=E(s,'line',{class:'cur',stroke:'#fff','stroke-width':1.5});const x=X(p[1],364);c.setAttribute('x1',x);c.setAttribute('x2',x);c.setAttribute('y1',4);c.setAttribute('y2',s.viewBox.baseVal.height-4)}
  const m=$('mapa');let q=m.querySelector('.cur');if(!q)q=E(m,'circle',{class:'cur',r:8,fill:'#fff',stroke:'#111','stroke-width':3});q.setAttribute('cx',p[5]);q.setAttribute('cy',p[6]);
}
function local(svg,ev){const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;return{x:(ev.clientX-r.left)/r.width*vb.width,y:(ev.clientY-r.top)/r.height*vb.height}}
function tocar(s,f){s.addEventListener('pointerdown',f);s.addEventListener('pointermove',ev=>{if(ev.buttons||ev.pointerType==='mouse')f(ev)})}
if(lap>=0){
for(const id of ['gVel','gAce'])tocar($(id),ev=>{const s=ev.currentTarget,{x}=local(s,ev),M=C.vueltas[lap].m,d=(x-30)/(364-36)*C.vueltas[lap].L;let b=0;M.forEach((p,i)=>{if(Math.abs(p[1]-d)<Math.abs(M[b][1]-d))b=i});marcar(b)});
tocar($('mapa'),ev=>{const {x,y}=local($('mapa'),ev),M=C.vueltas[lap].m;let b=0,bd=1e9;M.forEach((p,i)=>{const d=(p[5]-x)**2+(p[6]-y)**2;if(d<bd){bd=d;b=i}});marcar(b)});}
</script></body></html>
