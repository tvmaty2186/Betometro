name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04   # ya trae el SDK de Android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Número de versión
        id: ver
        run: |
          # La versión sale de package.json. Si todavía no está publicada, este build la publica.
          V=$(node -p "require('./package.json').version")
          echo "name=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" > /dev/null; then
            echo "nueva=0" >> "$GITHUB_OUTPUT"; echo "La versión $V ya está publicada: solo se compila."
          else
            echo "nueva=1" >> "$GITHUB_OUTPUT"; echo "Versión nueva: $V"
          fi

      - name: Llave de firma
        env:
          KS: ${{ secrets.BETO_KEYSTORE_B64 }}
          PASS_CRUDA: ${{ secrets.BETO_PASS }}
        run: |
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/beto.keystore"
            # La contraseña se limpia: espacios, saltos de línea o el texto "Contraseña...:" pegado de más
            # Si se pegó el texto entero del archivo LEEME, se toma la contraseña (24 letras y números seguidos)
            PASS=$(printf '%s' "$PASS_CRUDA" | grep -oE '[A-Za-z0-9]{24}' | head -1)
            [ -z "$PASS" ] && PASS=$(printf '%s' "$PASS_CRUDA" | tr -d '\r\n' | sed 's/.*: *//' | tr -d ' ')
            echo "::add-mask::$PASS"
            echo "Llave: $(wc -c < "$RUNNER_TEMP/beto.keystore") bytes (debe ser 2670). Contraseña: ${#PASS} caracteres (debe ser 24)."
            if ! keytool -list -keystore "$RUNNER_TEMP/beto.keystore" -storepass "$PASS" -alias betometro > "$RUNNER_TEMP/k.log" 2>&1; then
              grep -iv "JAVA_TOOL" "$RUNNER_TEMP/k.log" | head -3
              echo "::error::La llave no se pudo abrir. Revisá los secretos BETO_KEYSTORE_B64 y BETO_PASS."
              exit 1
            fi
            echo "BETO_KEYSTORE=$RUNNER_TEMP/beto.keystore" >> "$GITHUB_ENV"
            echo "BETO_KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"
            echo "BETO_KEY_PASS=$PASS" >> "$GITHUB_ENV"
            echo "FIRMADO=1" >> "$GITHUB_ENV"
          else
            echo "No hay llave de firma cargada: se compila una versión de prueba solo para verificar."
          fi

      - name: Compilar
        working-directory: android
        env:
          BETO_KEY_ALIAS: betometro
        run: |
          chmod +x gradlew
          if [ "$FIRMADO" = "1" ]; then TAREA=assembleRelease; else TAREA=assembleDebug; fi
          ./gradlew "$TAREA" -PvCode=${{ github.run_number }} -PvName=${{ steps.ver.outputs.name }} --no-daemon --stacktrace
          mkdir -p ../salida
          find app/build/outputs/apk -name '*.apk' -exec cp {} ../salida/betometro.apk \;
          ls -la ../salida

      - uses: actions/upload-artifact@v4
        with:
          name: betometro-apk
          path: salida/betometro.apk

      - name: Publicar versión
        if: steps.ver.outputs.nueva == '1' && env.FIRMADO == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Betómetro ${{ steps.ver.outputs.name }}
          files: salida/betometro.apk

      - name: Falta la llave de firma
        if: steps.ver.outputs.nueva == '1' && env.FIRMADO != '1'
        run: |
          echo "::error::Para publicar una versión hay que cargar los secretos BETO_KEYSTORE_B64 y BETO_PASS en el repositorio."
          exit 1
