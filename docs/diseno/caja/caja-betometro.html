<title>Caja Betómetro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Banco de trabajo: visor 3D arriba a todo el ancho, mesa de control y lista de piezas abajo */
:root {
  --bg: #131518; --panel: #1b1e22; --borde: #2c3137; --ink: #eceef0; --sub: #8d959e;
  --rojo: #d7263d; --ama: #f5c518; --verde: #2ecc71;
  --f-disp: "Barlow Condensed", "Arial Narrow", sans-serif; --f-txt: "Barlow", system-ui, sans-serif; --f-mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-txt); font-size: 15px; }
.envolt { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 28px; display: grid; gap: 12px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--f-disp); font-weight: 700; font-size: 30px; letter-spacing: .04em; margin: 0; text-transform: uppercase; text-wrap: balance; }
h1 b { color: var(--rojo); }
.medidas { font-family: var(--f-mono); font-size: 12px; color: var(--sub); }
.visor { position: relative; height: min(68vh, 620px); min-height: 380px; border: 1px solid var(--borde); border-radius: 14px; overflow: hidden; background: radial-gradient(110% 85% at 50% 28%, #3a3f46 0%, #24272c 45%, #141619 100%); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.etiqueta { position: absolute; left: 12px; bottom: 12px; right: 12px; pointer-events: none; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.etiqueta span { background: #0d0f11d9; border: 1px solid var(--borde); border-radius: 10px; padding: 8px 12px; font-size: 13px; max-width: 100%; }
.etiqueta b { color: var(--ama); font-weight: 600; }
.ayuda { color: var(--sub); }
.mesa { display: grid; grid-template-columns: 1fr; gap: 10px; background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; padding: 14px; }
.fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fila > label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--sub); font-weight: 600; min-width: 92px; }
button { font: 600 14px var(--f-txt); color: var(--ink); background: #262a30; border: 1px solid var(--borde); border-radius: 10px; padding: 9px 14px; cursor: pointer; }
button.on { background: var(--rojo); border-color: var(--rojo); color: #fff; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ama); outline-offset: 2px; }
input[type=range] { flex: 1; min-width: 160px; accent-color: var(--rojo); }
.piezas { background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; padding: 6px 0; }
.piezas h2 { font-family: var(--f-disp); font-size: 18px; letter-spacing: .1em; text-transform: uppercase; margin: 8px 14px; }
.pieza { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--borde); cursor: pointer; }
.pieza:hover, .pieza.sel { background: #d7263d1f; }
.pieza i { width: 14px; height: 14px; border-radius: 4px; display: block; }
.pieza div { min-width: 0; } .pieza strong { display: block; font-weight: 600; } .pieza small { color: var(--sub); font-size: 13px; }
.pieza code { font-family: var(--f-mono); font-size: 12px; color: var(--sub); white-space: nowrap; }
.nota { color: var(--sub); font-size: 13px; line-height: 1.5; margin: 0 14px 10px; }
@media (min-width: 900px) { .abajo { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 12px; align-items: start; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="envolt">
  <header>
    <h1>Caja <b>Betómetro</b></h1>
    <span class="medidas" id="medidas"></span>
  </header>
  <div class="visor" id="visor">
    <canvas id="lienzo" aria-label="Modelo 3D de la caja"></canvas>
    <div class="etiqueta"><span id="info"><b>Tocá una pieza</b> para ver qué es. Arrastrá para girar, pellizcá para acercar.</span></div>
  </div>
  <div class="abajo">
    <div class="mesa">
      <div class="fila"><label for="desarme">Desarmar</label><input type="range" id="desarme" min="0" max="1" step="0.001" value="0"></div>
      <div class="fila"><label>Animación</label><button id="btnDesarmar" type="button">Desarmar</button><button id="btnArmar" type="button">Armar</button></div>
      <div class="fila"><label>Posición</label><button id="btnVert" type="button" class="on">Vertical</button><button id="btnHoriz" type="button">Horizontal ↻</button></div>
      <div class="fila"><label>Vista</label><button id="btnFrente" type="button">Frente</button><button id="btnAtras" type="button">Atrás</button><button id="btnLado" type="button">Lado</button><button id="btnTres" type="button">3/4</button></div>
      <div class="fila"><label>Cables</label><button id="btnCables" type="button" class="on">Pulsador y 12 V</button></div>
    </div>
    <div class="piezas">
      <h2>Piezas</h2>
      <p class="nota">Medidas en milímetros. Celular Samsung Galaxy A37 (162,9 × 78,2 × 7,4). Hub, cargador, codificador y cooler con medidas típicas: se ajustan cuando elijas los modelos.</p>
      <div id="lista"></div>
    </div>
  </div>
</div>

function caminoRedondo(w, h, r, cx, cy) { const p = new THREE.Path(), x = cx - w / 2, y = cy - h / 2; r = Math.min(r, w / 2 - .01, h / 2 - .01);
